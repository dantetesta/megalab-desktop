name: Build LotoLogic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npx tauri build
        env:
          CI: "true"

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        with:
          name: LotoLogic-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: LotoLogic-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

  build-macos-silicon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Silicon
        run: npx tauri build --target aarch64-apple-darwin
        env:
          CI: "true"

      - name: Upload macOS Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: LotoLogic-macOS-Silicon
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Intel
        run: npx tauri build --target x86_64-apple-darwin
        env:
          CI: "true"

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: LotoLogic-macOS-Intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npx tauri build
        env:
          CI: "true"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LotoLogic-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: LotoLogic-Linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: [build-windows, build-macos-silicon, build-macos-intel, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LotoLogic v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/LotoLogic-Windows-Setup/*
            release-artifacts/LotoLogic-Windows-MSI/*
            release-artifacts/LotoLogic-macOS-Silicon/*
            release-artifacts/LotoLogic-macOS-Intel/*
            release-artifacts/LotoLogic-Linux-AppImage/*
            release-artifacts/LotoLogic-Linux-deb/*
